[project]
name = "deepdive-research"
version = "0.1.0"
description = "A source-verifying multi-agent research assistant for Agent Arena 2026"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.135.3",
  "uvicorn==0.44.0",
  "langgraph>=1.0.10,<2",
  "langchain-core>=1.3.3,<2",
  "langgraph-checkpoint>=4.1.1,<5",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
  "langgraph-sdk>=0.4.4,<0.5",
  "openai==1.99.6",
  "pydantic==2.11.7",
  "httpx==0.28.1",
  "beautifulsoup4==4.14.3",
  "python-dotenv>=1.2.2,<2",
  "streamlit==1.56.0",
  "matplotlib==3.10.8",
  "pandas==3.0.1",
  "python-pptx==1.0.2",
  "pillow>=12.3,<13",
  "tiktoken==0.11.0",
  "prometheus-client>=0.21,<1",
  "sentry-sdk>=2.20,<3",
  "pypdf>=6.21.1,<7",
  "defusedxml>=0.7.1,<1",
  "numpy>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.ruff]
extend-exclude = [".uv-cache"]

[tool.mypy]
plugins = ["pydantic.mypy"]
files = ["deepdive/models.py", "deepdive/config.py"]
ignore_missing_imports = true
follow_imports = "silent"
