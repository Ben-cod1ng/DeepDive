name: Release container
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: deepdive-release
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  publish:
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.0
      - run: uv sync --frozen
      - name: Evaluate release candidate
        env:
          MESH_API_KEY: ${{ secrets.MESH_API_KEY }}
          DEEPDIVE_RELEASE: ${{ github.sha }}
        run: |
          uv run --no-sync python -m deepdive.evaluation verifier --output evaluation/results/release-verifier.json
          uv run --no-sync python -m deepdive.evaluation gate evaluation/results/release-verifier.json
      - name: Build, authenticate, and publish immutable commit tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GH_REPOSITORY,,}:sha-${COMMIT}"
          docker build --label "org.opencontainers.image.revision=${COMMIT}" --label "org.opencontainers.image.source=https://github.com/${GH_REPOSITORY}" -t "$IMAGE" .
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" > evaluation/results/image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-manifest
          path: |
            evaluation/results/release-verifier.json
            evaluation/results/image-digest.txt
          retention-days: 90
