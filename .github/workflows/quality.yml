name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.0
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync ruff check deepdive tests streamlit_app.py
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python -m compileall -q deepdive streamlit_app.py
      - run: uv run --no-sync pytest -q --junitxml=evaluation/results/junit.xml
      - run: uv run --no-sync python -m deepdive.evaluation fixtures --output evaluation/results/fixture-gates.json
      - run: uv run --no-sync pip-audit --format json --output evaluation/results/dependency-audit.json
      - run: uv export --frozen --no-dev --format requirements-txt --output-file evaluation/results/runtime-requirements.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-evidence
          path: evaluation/results/
          retention-days: 30
  container:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.0
      - run: uv sync --frozen
      - run: uv run --no-sync python -m deepdive.ops init
      - run: docker compose config --quiet
      - run: docker compose build api
      - name: Railway startup, private networking, and volume persistence
        run: uv run --no-sync python tests/railway_smoke.py --image deepdive:local --output evaluation/results/railway-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: railway-startup-evidence
          path: evaluation/results/railway-smoke.json
          retention-days: 30
      - run: docker compose --profile monitoring up --no-build --wait --wait-timeout 180
      - run: uv run --no-sync python -m deepdive.ops health
      - run: uv run --no-sync python -m deepdive.smoke
      - name: Monitoring configuration
        run: docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
      - name: Monitoring HTTP smoke
        run: uv run --no-sync python -m deepdive.monitoring_smoke --output evaluation/results/monitoring-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monitoring-evidence
          path: evaluation/results/monitoring-smoke.json
          retention-days: 30
      - name: Shutdown
        if: always()
        run: docker compose --profile monitoring down
