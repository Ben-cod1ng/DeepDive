name: Live Mesh evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: live-validation
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.0
      - run: uv sync --frozen
      - name: Evaluate versioned claim set through Mesh
        env:
          MESH_API_KEY: ${{ secrets.MESH_API_KEY }}
          DEEPDIVE_RELEASE: ${{ github.sha }}
        run: uv run --no-sync python -m deepdive.evaluation verifier --output evaluation/results/live-verifier.json
      - name: Compare document retrieval stages through Mesh
        env:
          MESH_API_KEY: ${{ secrets.MESH_API_KEY }}
          DEEPDIVE_RELEASE: ${{ github.sha }}
        run: uv run --no-sync python -m deepdive.rag_evaluation --output evaluation/results/live-rag.json
      - name: Assess promotion gate
        run: uv run --no-sync python -m deepdive.evaluation gate evaluation/results/live-verifier.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-evaluation
          path: |
            evaluation/results/live-verifier.json
            evaluation/results/live-rag.json
          retention-days: 90
